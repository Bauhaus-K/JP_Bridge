name: E2E

on:
  workflow_dispatch:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Lite Supabase stack (Postgres, Auth, REST, Mailpit)
        run: bash scripts/lite-stack.sh up
      - name: Gateway
        run: node scripts/lite-gateway.mjs &
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Playwright (mock Anthropic API, referral flag on)
        run: npx playwright test
        env:
          E2E_PORT: "3000"
          E2E_ADMIN_EMAIL: ops@example.com
          E2E_REFERRAL: "1"
          FEATURE_REFERRAL: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
